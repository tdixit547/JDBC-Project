<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAdmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <script>Auth.requireAdmin();</script>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="brand">ShopAdmin</div>
            <div class="brand-sub">MANAGEMENT PANEL</div>
        </div>
        <ul class="nav-links">
            <li>
                <a href="#" data-page="dashboard" class="active">
                    Dashboard
                </a>
            </li>
            <li>
                <a href="#" data-page="products">
                    Products
                </a>
            </li>
            <li>
                <a href="#" data-page="users">
                    Users
                </a>
            </li>
            <li>
                <a href="#" data-page="cart">
                    Cart
                </a>
            </li>
            <li>
                <a href="#" data-page="orders">
                    Orders
                </a>
            </li>
        </ul>
        <div style="padding:12px;border-top:1px solid #2e3144;margin-top:auto;display:flex;flex-direction:column;gap:8px;">
            <a href="shop.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:#6366f1;font-size:0.85rem;font-weight:600;text-decoration:none;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);">
                Customer Store
            </a>
            <button onclick="Auth.logout()" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:#ef4444;font-size:0.85rem;font-weight:600;text-decoration:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);cursor:pointer;width:100%;text-align:left;">
                Logout
            </button>
        </div>
    </nav>
    <main id="content"></main>
    <div id="toast-container"></div>
    <div id="modal-overlay" class="hidden">
        <div class="modal" id="modal"></div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
